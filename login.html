<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GroShare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <span class="groshare-text">GroShare</span>
          <span class="groshare-annotation ms-1 d-flex align-items-center">
            <i class="fas fa-pencil-alt me-1 fs-5"></i>
            <i class="fas fa-check fs-5 text-white"></i>
          </span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="pages/profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="login.html">Login</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="pages/profile.html">Profile</a>
            </li>

            <li class="nav-item">
              <a class="nav-link btn-register ms-lg-3" href="register.html"
                >Register</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main
      class="container d-flex justify-content-center align-items-center register-container"
    >
      <div class="card register-card shadow-sm border-0">
        <div class="card-body p-4 text-center">
          <h3 class="register-title mb-4">Login</h3>
          <form class="text-start">
            <div class="mb-3">
              <label class="form-label fw-bold">Username</label>
              <input
                type="text"
                class="form-control register-input"
                placeholder="Enter username"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input
                type="password"
                class="form-control register-input"
                placeholder="Enter password"
              />
            </div>
            <button type="submit" class="btn btn-register-submit w-100 mt-2">
              Sign In
            </button>
          </form>
          <div class="mt-4">
            <p class="mb-1 text-muted small">Don't have an account?</p>
            <a href="register.html" class="login-link">Sign Up</a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
