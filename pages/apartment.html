<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apartment - GroShare</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <span class="groshare-text">GroShare</span>
          <span class="groshare-annotation ms-1 d-flex align-items-center">
            <i class="fas fa-pencil-alt me-1 fs-5"></i>
            <span class="groshare-underline"></span>
            <i class="fas fa-check fs-5 text-white"></i>
          </span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto"></ul>
        </div>
      </div>
    </nav>

    <div class="container apartment-container">
      <div class="apartment-header mb-4">
        <div class="flex-grow-1 me-3">
          <h1 id="apartment-name-display" class="apartment-title mb-2">
            Apartment Name
          </h1>
          <input
            id="apartment-name-input"
            type="text"
            class="form-control apartment-edit-field d-none"
          />
        </div>

        <div class="d-flex gap-2 align-items-center">
          <button
            id="apartment-edit-button"
            class="apartment-edit-btn"
            type="button"
          >
            Edit
          </button>
        </div>
      </div>

      <!-- Grid Row -->
      <div class="row">
        <!-- LEFT: Details -->
        <div class="col-lg-6 col-12">
          <div class="apartment-details">
            <div class="apartment-form-group">
              <label>Address</label>
              <p id="apartment-address-display" class="apartment-display-value">
                123 Main Street
              </p>
              <input
                id="apartment-address-input"
                type="text"
                class="form-control d-none"
              />
            </div>

            <div class="apartment-form-group">
              <label>City</label>
              <p id="apartment-city-display" class="apartment-display-value">
                Vienna
              </p>
              <input
                id="apartment-city-input"
                type="text"
                class="form-control d-none"
              />
            </div>

            <div class="apartment-form-group">
              <label>Roommates Count</label>
              <p id="apartment-roommates-count" class="apartment-display-value">
                3
              </p>
            </div>

            <div class="apartment-form-group mt-4">
              <h3 class="h5 mb-3">Send Invite</h3>
              <label for="apartment-invite-username" class="form-label"
                >Username</label
              >
              <input
                id="apartment-invite-username"
                type="text"
                class="form-control"
                placeholder="Enter username"
              />
              <button
                id="apartment-invite-button"
                class="apartment-edit-btn mt-3"
                type="button"
              >
                Send Invite
              </button>
              <div
                id="apartment-invite-message"
                class="alert alert-danger text-start d-none mt-3 mb-0"
                role="alert"
              ></div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Roommates -->
        <div class="col-lg-6 col-12">
          <div class="apartment-roommates">
            <h2>Roommates</h2>

            <div id="apartment-roommates-list" class="roommate-list">
              <div class="roommate-item">
                <div class="roommate-avatar"></div>
                <span class="roommate-name">Max Mustermann</span>
              </div>

              <div class="roommate-item">
                <div class="roommate-avatar"></div>
                <span class="roommate-name">Anna Schmidt</span>
              </div>

              <div class="roommate-item">
                <div class="roommate-avatar"></div>
                <span class="roommate-name">John Doe</span>
              </div>

              <div class="roommate-item">
                <div class="roommate-avatar"></div>
                <span class="roommate-name">Jane Doe</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button
        id="apartment-save-button"
        class="btn btn-success w-100 mt-4 d-none"
        type="button"
      >
        Save
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/main.js"></script>
    <script type="module" src="/dist/pages/apartment.js"></script>
  </body>
</html>
