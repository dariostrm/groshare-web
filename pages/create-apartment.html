<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Apartment - GroShare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="groshare-text">GroShare</span>
          <span class="groshare-annotation ms-1 d-flex align-items-center">
            <i class="fas fa-pencil-alt me-1 fs-5"></i>
            <i class="fas fa-check fs-5 text-white"></i>
          </span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto"></ul>
        </div>
      </div>
    </nav>

    <main
      class="container d-flex justify-content-center align-items-center register-container"
    >
      <div class="card register-card shadow-sm border-0">
        <div class="card-body p-4 text-center">
          <h3 class="register-title mb-2">Create Apartment</h3>
          <p class="text-muted small mb-4">
            Add the apartment details so your roommates can join it.
          </p>
          <div
            id="create-apartment-message"
            class="alert alert-danger text-start d-none"
            role="alert"
          ></div>
          <form
            class="text-start validate"
            novalidate
            id="create-apartment-form"
          >
            <div class="mb-3">
              <label class="form-label fw-bold">Apartment Name</label>
              <input
                type="text"
                id="name"
                class="form-control register-input"
                name="name"
                placeholder="Enter apartment name"
                required
              />
              <div class="invalid-feedback">Apartment name is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Address</label>
              <input
                type="text"
                id="address"
                class="form-control register-input"
                name="address"
                placeholder="Street and number"
                required
              />
              <div class="invalid-feedback">Address is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">City</label>
              <input
                type="text"
                id="city"
                class="form-control register-input"
                name="city"
                placeholder="Enter city"
                required
              />
              <div class="invalid-feedback">City is required.</div>
            </div>

            <button type="submit" class="btn btn-register-submit w-100 mt-2">
              Create Apartment
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/main.js"></script>
    <script type="module" src="/dist/validation.js"></script>
    <script type="module" src="/dist/pages/create-apartment.js"></script>
  </body>
</html>
