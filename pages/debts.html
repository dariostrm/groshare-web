<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debts - GroShare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="groshare-text">GroShare</span>
          <span class="groshare-annotation ms-1 d-flex align-items-center">
            <i class="fas fa-pencil-alt me-1 fs-5"></i>
            <i class="fas fa-check fs-5 text-white"></i>
          </span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto"></ul>
        </div>
      </div>
    </nav>

    <main class="container debts-page py-4 py-lg-5">
      <div class="debts-shell">
        <div id="debts-balance-banner" class="debts-banner mb-4">
          <p
            id="debts-balance-label"
            class="text-uppercase fw-semibold small mb-1"
          >
            Net balance
          </p>
          <h1 id="debts-balance-value" class="debts-balance-value mb-0">
            €0.00
          </h1>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-3">
          <div>
            <p class="text-uppercase text-secondary fw-semibold small mb-1">
              Roommates
            </p>
            <h2 class="h4 mb-0">Current debts</h2>
          </div>
        </div>

        <div id="debts-list" class="debts-list d-grid gap-3"></div>
      </div>
    </main>

    <div
      id="debts-settle-modal"
      class="modal fade"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content debts-settle-modal-content">
          <div class="modal-header">
            <h2 id="debts-settle-modal-title" class="modal-title h4 mb-0">
              How much money did you give back?
            </h2>
            <button
              id="debts-settle-close"
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <label for="debts-settle-amount-input" class="form-label fw-semibold">
              Amount
            </label>
            <div class="input-group">
              <span class="input-group-text">€</span>
              <input
                id="debts-settle-amount-input"
                type="number"
                class="form-control"
                min="0"
                step="0.01"
                inputmode="decimal"
                pattern="^\\d+(?:\\.\\d{0,2})?$"
              />
            </div>
          </div>

          <div class="modal-footer">
            <button
              id="debts-settle-submit"
              type="button"
              class="btn debt-settle-submit-btn"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/main.js"></script>
    <script type="module" src="/dist/pages/debts.js"></script>
  </body>
</html>
