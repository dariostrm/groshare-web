<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groceries - GroShare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="groshare-text">GroShare</span>
          <span class="groshare-annotation ms-1 d-flex align-items-center">
            <i class="fas fa-pencil-alt me-1 fs-5"></i>
            <i class="fas fa-check fs-5 text-white"></i>
          </span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto"></ul>
        </div>
      </div>
    </nav>

    <main class="container groceries-page py-4 py-lg-5">
      <div class="groceries-shell">
        <div class="groceries-header mb-4">
          <div>
            <p class="text-uppercase text-secondary fw-semibold small mb-1">
              Shared list
            </p>
            <h1 class="groceries-title mb-0">Groceries</h1>
          </div>
        </div>

        <div class="groceries-toolbar sticky-top">
          <div class="input-group input-group-lg">
            <input
              id="groceries-name-input"
              type="text"
              class="form-control groceries-input"
              placeholder="Add a grocery item"
              aria-label="Grocery name"
            />
            <button
              id="groceries-add-button"
              class="btn groceries-add-btn"
              type="button"
            >
              Add grocery
            </button>
          </div>
        </div>

        <div class="groceries-list-panel mt-4">
          <div
            id="groceries-empty-state"
            class="groceries-empty-state text-muted d-none"
          >
            No groceries yet
          </div>

          <div id="groceries-list" class="groceries-list d-grid gap-3"></div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/main.js"></script>
    <script type="module" src="/dist/pages/groceries.js"></script>
  </body>
</html>
