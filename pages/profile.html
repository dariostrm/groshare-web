<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - GroShare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-groshare sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
          <span class="groshare-text">GroShare</span>
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="apartment.html">Apartment</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn-register ms-lg-3" href="register.html"
                >Register</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main
      class="container d-flex flex-column justify-content-center align-items-center mt-5"
    >
      <div
        class="card register-card shadow-sm border-0 p-4 w-100"
        style="max-width: 500px"
      >
        <h3 class="register-title text-center mb-4">My Profile</h3>

        <div class="text-center mb-4">
          <div
            class="app-placeholder mx-auto mb-2 d-flex align-items-center justify-content-center"
            style="
              width: 120px;
              height: 120px;
              border-radius: 50%;
              background-color: #e9ecef;
            "
          >
            <i class="fas fa-user fa-3x text-secondary"></i>
          </div>
          <label class="form-label fw-bold mt-2">Change Picture:</label>
          <input
            type="file"
            class="form-control register-input mt-2"
            id="profile-pic-input"
          />
        </div>

        <form id="profile-form" class="text-start text-input">
          <div class="mb-3 text-start">
            <label class="form-label fw-bold">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control register-input"
              placeholder="name"
            />
          </div>
          <div class="mb-3 text-start">
            <label class="form-label fw-bold">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control register-input"
              placeholder="email.example@hotmail.com"
            />
          </div>

          <button type="submit" class="btn btn-register-submit w-100 mb-4">
            Save Changes
          </button>
        </form>

        <hr />

        <div class="mt-3 text-center">
          <h4 class="register-title" style="font-size: 1.8rem">Apartment</h4>
          <p class="form-label fw-bold mt-2">
            Current: <strong> Shared Flat #1</strong>
          </p>
          <button
            class="btn btn-outline-danger w-100 auth-footer-text"
            style="border-radius: 10px"
          >
            Leave Apartment
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
